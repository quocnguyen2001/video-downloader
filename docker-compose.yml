services:
  # Backend nginx - serves Laravel admin panel and API
  backend-nginx:
    image: nginx:alpine
    ports:
      - "8080:80"  # Backend domain port
    volumes:
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - backend
    networks:
      - app
    environment:
      - NGINX_HOST=backend.com
      - NGINX_PORT=80

  # Frontend nginx - serves React application
  frontend-nginx:
    image: nginx:alpine
    ports:
      - "3000:80"  # Frontend domain port
    volumes:
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-build:/usr/share/nginx/html:ro
    depends_on:
      - frontend
    networks:
      - app
    environment:
      - NGINX_HOST=frontend.com
      - NGINX_PORT=80

  # Laravel backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - ./.env
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - mysql
    networks:
      - app
    environment:
      - APP_URL=http://backend.com:8080

  # React frontend build service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    volumes:
      - frontend-build:/app/build
    networks:
      - app
    environment:
      - REACT_APP_BACKEND_API_URL=http://backend.com:8080/api/v1

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app

networks:
  app:

volumes:
  dbdata:
  frontend-build: